# aria2.conf — aria2 ডাউনলোড সেটিংস (Bangla)
# ব্যবহার: aria2c --conf-path=aria2.conf <url>
#    অথবা: aria2c --conf-path=aria2.conf -i example-urls.txt
#
# সব অপশনের নাম যাচাই করা হয়েছে অফিসিয়াল aria2 ম্যানুয়াল থেকে:
# https://aria2.github.io/manual/en/html/aria2c.html

# --- ফাইল কোথায় নামবে ---
# ডাউনলোড ফোল্ডার (না থাকলে aria2 বানিয়ে নেবে)
dir=${HOME}/Downloads/aria2
# একই নামের ফাইল থাকলে ওভাররাইট না করে -1, -2... যোগ করবে
auto-file-renaming=true
allow-overwrite=false
# আধা-ডাউনলোড ফাইল .aria2 কন্ট্রোল ফাইলসহ রাখবে, যাতে resume করা যায়
continue=true

# --- গতি: ১৬ কানেকশন ---
# এক সার্ভার থেকে এক ফাইলে সর্বোচ্চ ১৬ কানেকশন
max-connection-per-server=16
# এক ফাইলকে ১৬ ভাগে ভাগ করে নামাবে
split=16
# ভাগ করার জন্য ফাইলের একেক ভাগ কমপক্ষে ১ MB হতে হবে
min-split-size=1M
# একসাথে ৫টা ফাইল নামবে
max-concurrent-downloads=5

# --- স্পিড লিমিট (খালি রাখলে = আনলিমিটেড) ---
# সব ডাউনলোড মিলিয়ে সর্বোচ্চ গতি — ডিফল্ট 0 = সীমা নেই
# সীমা দিতে চাইলে নিচের লাইনের # সরিয়ে মান বসান (যেমন 5M = 5 MB/s)
max-overall-download-limit=0
# একেক ফাইলের সর্বোচ্চ গতি (0 = সীমা নেই)
max-download-limit=0

# --- রিজিউম / রিট্রাই ---
# ব্যর্থ হলে ১০ বার চেষ্টা করবে
max-tries=10
# দুই চেষ্টার মাঝে ৫ সেকেন্ড অপেক্ষা
retry-wait=5
# সার্ভার সাড়া না দিলে ৬০ সেকেন্ড পর টাইমআউট
timeout=60
connect-timeout=60

# --- ডিস্ক ও মেমোরি ---
# ফাইলের জায়গা আগে থেকে বরাদ্দ করবে না (ডিস্কে জায়গা কম থাকলে ভালো)
file-allocation=none
# মেমোরি ক্যাশ ১৬ MB
disk-cache=16M

# --- দেখতে কেমন হবে ---
# প্রতি ১০ সেকেন্ডে একবার অগ্রগতি দেখাবে
summary-interval=10
# লগে শুধু সতর্কবার্তা আর ভুল দেখাবে
log-level=warn
# সার্ভারকে ব্রাউজারের মতো পরিচয় দেবে (কিছু সার্ভার aria2-কে ব্লক করে)
user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36
# HTTPS সার্টিফিকেট যাচাই করবে (নিরাপত্তার জন্য true রাখুন)
check-certificate=true

# --- RPC (ঐচ্ছিক — বন্ধ রাখাই ডিফল্ট) ---
# Web UI (যেমন AriaNg) দিয়ে চালাতে চাইলে নিচের দুটো লাইনের # সরান।
# সতর্কতা: RPC খুললে পাসওয়ার্ড ছাড়া যে কেউ আপনার aria2 চালাতে পারবে —
# শুধু নিজের কম্পিউটারে (localhost) ব্যবহার করুন।
# enable-rpc=true
# rpc-listen-port=6800
